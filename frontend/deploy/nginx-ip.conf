server {
    listen 80;
    server_name 47.83.171.75;

    client_max_body_size 10m;

    # Keep the public search BFF behavior for endpoints that filter upstream data.
    location = /api/melost/search {
        proxy_pass http://127.0.0.1:13000;
        include proxy_params;
        proxy_read_timeout 180s;
    }

    location = /api/melost/resources {
        proxy_pass http://127.0.0.1:13000;
        include proxy_params;
        proxy_read_timeout 180s;
    }

    location ~ ^/api/resources/[0-9]+/link$ {
        proxy_pass http://127.0.0.1:13000;
        include proxy_params;
        proxy_read_timeout 180s;
    }

    location ~ ^/api/resources/key/[A-Za-z0-9_-]+$ {
        proxy_pass http://127.0.0.1:13000;
        include proxy_params;
        proxy_read_timeout 180s;
    }

    # Public URLDB API. Administrative endpoints remain protected by JWT auth.
    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        include proxy_params;
        proxy_read_timeout 180s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:18080;
        include proxy_params;
    }

    location /data/ {
        proxy_pass http://127.0.0.1:18080;
        include proxy_params;
    }

    # URLDB administration frontend and its client assets.
    location ~ ^/(admin(?:/|$)|admin-old(?:/|$)|login$|register$|user(?:/|$)|api-docs$|monitor$) {
        proxy_pass http://127.0.0.1:13001;
        include proxy_params;
        proxy_read_timeout 180s;
    }

    location /_nuxt/ {
        proxy_pass http://127.0.0.1:13001;
        include proxy_params;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:13001;
        include proxy_params;
        expires 1d;
    }

    location = /api/web-vitals {
        proxy_pass http://127.0.0.1:13001;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
