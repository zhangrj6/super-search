name: super-search

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: url_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  backend:
    image: ghcr.io/zhangrj6/super-search-backend:latest
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: url_db
      PORT: 8080
      TIMEZONE: Asia/Shanghai
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/root/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18080}:8080"
    networks:
      - internal

  admin:
    image: ghcr.io/zhangrj6/super-search-admin:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_SERVER: http://backend:8080/api
      NUXT_PUBLIC_API_BASE: /api
      NUXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${ADMIN_PORT:-13001}:3000"
    networks:
      - internal

  frontend:
    image: ghcr.io/zhangrj6/super-search-frontend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      URLDB_API_BASE: http://backend:8080/api
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-13000}:3000"
    networks:
      - internal

volumes:
  postgres_data:
  uploads:

networks:
  internal:
    driver: bridge
